name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run task verify
        run: task verify

      - name: Isolated Alpine and vfs integration
        if: runner.os == 'Linux'
        run: sh test/integration/smoke.sh

      - name: Slackware static binary smoke
        if: runner.os == 'Linux'
        run: docker run --rm --network none -v "$PWD/bin/dodu:/usr/local/bin/dodu:ro" vbatts/slackware:15.0 dodu version
